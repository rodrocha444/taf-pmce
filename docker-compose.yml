services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taf-pmce-dev
    restart: unless-stopped
    ports:
      - "5555:5555"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=development
